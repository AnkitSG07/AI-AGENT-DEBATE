<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#008069">
  <title>Open call in Smart Handicrafts Operator Hub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0f2f5;color:#111b21;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(440px,100%);padding:30px;border:1px solid #e1e7e4;border-radius:20px;background:#fff}h1{font-size:24px;line-height:1.25;margin:0 0 12px}p{color:#667781;margin:0 0 20px}a{display:inline-flex;min-height:44px;align-items:center;padding:10px 18px;border-radius:999px;background:#008069;color:#fff;font-weight:600;text-decoration:none}a:focus-visible{outline:3px solid #80cab2;outline-offset:4px}.brand{display:block;color:#008069;font-size:13px;font-weight:700;margin-bottom:18px}
  </style>
</head>
<body>
  <main class="card">
    <span class="brand">Smart Handicrafts®</span>
    <h1 id="callHeading">Opening your call in Operator Hub</h1>
    <p id="callExplanation">Continue in Operator Hub. Starting or answering a call requires your choice there.</p>
    <a id="openHubBtn" href="https://www.smarthandicrafts.com/livechat-api-test">Open Operator Hub</a>
  </main>
  <script>
(() => {
  const OPERATOR_HUB_URL = 'https://www.smarthandicrafts.com/livechat-api-test';
  const cleanPhone = value => String(value || '').replace(/\D/g, '');
function hubCallId(value) {
  if (typeof value === 'number') return Number.isSafeInteger(value) && value > 0 ? String(value) : null;
  if (typeof value !== 'string' || !value || value.length > 220 || /[\s\u0000-\u001f\u007f]/u.test(value) || /^(?:null|undefined|none|NaN|true|false|0)$/i.test(value)) return null;
  try { encodeURIComponent(value); } catch { return null; }
  return value;
}

function hubTargetCallId(record = {}) {
  const supplied = [record.call_id, record.callId].filter(value => value !== undefined && value !== null && value !== '');
  if (!supplied.length) return null;
  const ids = supplied.map(hubCallId);
  return ids.every(id => id && id === ids[0]) ? ids[0] : null;
}

function operatorHubCallUrl(record = {}) {
  const target = new URL(OPERATOR_HUB_URL);
  const id = hubTargetCallId(record);
  if (!id) return target.href;
  target.searchParams.set('mode', 'call');
  target.searchParams.set('call_id', id);
  const number = cleanPhone(record.phone || record.customer_phone || record.customerPhone || record.from || '');
  if (number) target.searchParams.set('phone', number);
  const channelId = Number(record.channel_id || record.channelId || record.odoo_channel_id || 0);
  if (Number.isSafeInteger(channelId) && channelId > 0) target.searchParams.set('channel_id', String(channelId));
  return target.href;
}

function hubPhone(value) {
  if (typeof value !== 'string' || !/^[+\d\s().-]+$/.test(value)) return null;
  const digits = value.replace(/\D/g, '');
  return /^\d{7,15}$/.test(digits) ? digits : null;
}

function hubName(value) {
  return typeof value === 'string' && value.length <= 160 && !/[\u0000-\u001f\u007f]/u.test(value) ? value.trim() : '';
}

function exactQueryValue(query, keys, validate) {
  const supplied = keys.flatMap(key => query.getAll(key));
  if (!supplied.length) return null;
  const normalized = supplied.map(validate);
  return normalized.every(value => value && value === normalized[0]) ? normalized[0] : null;
}

function hubChannelId(value) {
  if (!/^\d+$/.test(String(value || ''))) return null;
  const id = Number(value);
  return Number.isSafeInteger(id) && id > 0 ? String(id) : null;
}

function hubTransferId(value) {
  return typeof value === 'string' && /^[A-Za-z0-9_-]{1,120}$/.test(value) ? value : null;
}

function operatorHubOutgoingUrl(number, name = '') {
  const target = new URL(OPERATOR_HUB_URL), digits = hubPhone(String(number || ''));
  if (!digits) return target.href;
  target.searchParams.set('mode', 'outgoing');
  target.searchParams.set('phone', digits);
  const displayName = hubName(name);
  if (displayName) target.searchParams.set('name', displayName);
  return target.href;
}

function operatorHubTransferUrl(transfer = {}) {
  const target = new URL(OPERATOR_HUB_URL);
  const id = hubCallId(transfer.call_id), transferId = hubTransferId(transfer.transfer_id);
  if (!id || !transferId) return target.href;
  target.searchParams.set('mode', 'transfer');
  target.searchParams.set('call_id', id);
  target.searchParams.set('transfer_id', transferId);
  return target.href;
}

function operatorHubEntryUrl(query) {
  const target = new URL(OPERATOR_HUB_URL);
  const modes = query.getAll('mode').map(value => value.toLowerCase()).filter(Boolean).map(value => value === 'incoming' ? 'call' : value);
  if (new Set(modes).size > 1) return target.href;
  const mode = modes[0] || '';
  const id = exactQueryValue(query, ['call_id', 'callId'], hubCallId);
  if ((query.has('call_id') || query.has('callId')) && !id) return target.href;
  const directions = query.getAll('direction').map(value => value.toLowerCase()).filter(Boolean);
  if (new Set(directions).size > 1) return target.href;
  const intents = ['outgoing', 'transfer', 'rejoin', 'recovery'].includes(mode) ? [mode] : [];
  if (directions.includes('outgoing')) intents.push('outgoing');
  if (['transfer_id', 'transferId', 'transfer_token', 'transferToken'].some(key => query.has(key))) intents.push('transfer');
  if (['rejoin_token', 'rejoinToken'].some(key => query.has(key))) intents.push('rejoin');
  if (['recovery_token', 'recoveryToken'].some(key => query.has(key))) intents.push('recovery');
  if (new Set(intents).size > 1) return target.href;
  const intent = intents[0] || '';
  if (intent === 'outgoing') {
    const number = exactQueryValue(query, ['phone'], hubPhone);
    return number ? operatorHubOutgoingUrl(number, query.get('name') || query.get('customer_name') || '') : target.href;
  }
  if (intent === 'transfer') {
    const transferId = exactQueryValue(query, ['transfer_id', 'transferId'], hubTransferId);
    return id && transferId ? operatorHubTransferUrl({ call_id: id, transfer_id: transferId }) : target.href;
  }
  const recoveryMode = ['rejoin', 'recovery'].includes(intent) ? intent : '';
  if (recoveryMode) {
    if (id) { target.searchParams.set('mode', recoveryMode); target.searchParams.set('call_id', id); }
    return target.href;
  }
  if (query.has('call_id') || query.has('callId') || ['call', 'incoming'].includes(mode)) {
    if (!id) return target.href;
    const record = { call_id: id };
    const number = exactQueryValue(query, ['phone'], hubPhone);
    const channel = exactQueryValue(query, ['channel_id', 'channelId', 'channel', 'odoo_channel_id'], hubChannelId);
    if (number) record.phone = number;
    if (channel) record.channel_id = channel;
    return operatorHubCallUrl(record);
  }
  if (['channel_id', 'channelId', 'channel', 'odoo_channel_id'].some(key => query.has(key))) {
    const channel = exactQueryValue(query, ['channel_id', 'channelId', 'channel', 'odoo_channel_id'], hubChannelId);
    if (channel) target.searchParams.set('channel_id', channel);
    return target.href;
  }
  return null;
}
  const destination = operatorHubEntryUrl(new URLSearchParams(location.search)) || OPERATOR_HUB_URL;
  const target = new URL(destination), mode = target.searchParams.get('mode');
  const heading = document.getElementById('callHeading'), explanation = document.getElementById('callExplanation');
  if (mode === 'outgoing') {
    heading.textContent = 'Prepare your call in Operator Hub';
    explanation.textContent = 'Review the number and choose Start call in the Hub. Opening this link does not place a call.';
  } else if (mode === 'transfer') {
    heading.textContent = 'Open your transfer in Operator Hub';
    explanation.textContent = 'The Hub checks that this transfer is assigned to you before offering Accept.';
  } else if (mode === 'rejoin' || mode === 'recovery') {
    heading.textContent = 'Check the call in Operator Hub';
    explanation.textContent = 'The Hub can show this call’s status. An older browser audio session is not resumed by this link.';
  } else if (target.searchParams.has('channel_id') && mode !== 'call') {
    heading.textContent = 'Opening your conversation';
    explanation.textContent = 'Continue the selected conversation in Operator Hub.';
  } else if (!target.searchParams.has('call_id')) {
    heading.textContent = 'Open Operator Hub';
    explanation.textContent = 'Choose the current conversation or call in Operator Hub.';
  }
  document.getElementById('openHubBtn').href = destination;
  location.replace(destination);
})();
</script>
</body>
</html>
