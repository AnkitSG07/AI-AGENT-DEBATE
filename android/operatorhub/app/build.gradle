plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.smarthandicrafts.operatorhub'
    compileSdk 35
    defaultConfig {
        applicationId 'com.smarthandicrafts.operatorhub'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.0-r17'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.simulation'; versionNameSuffix '-simulation' }
    }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    // Durable, network-constrained call cleanup only; never starts microphone capture.
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'io.livekit:livekit-android:2.29.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    // Exposes the pinned SDK's runtime protobuf classes to the real serialization regression.
    testImplementation 'com.google.protobuf:protobuf-javalite:3.25.9'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
