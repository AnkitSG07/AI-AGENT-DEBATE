# Prepared migration only. Creating this resource requires approval for $7/month compute.
# Start in read-only preflight; do not route call/message traffic here yet.
# Values resolve inside Render from the existing service; no secret values are stored here.
services:
  - type: web
    name: sh-chat-singapore
    runtime: node
    repo: https://github.com/AnkitSG07/AI-AGENT-DEBATE
    branch: main
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm install
    startCommand: node scripts/hosting-preflight.mjs
    healthCheckPath: /health
